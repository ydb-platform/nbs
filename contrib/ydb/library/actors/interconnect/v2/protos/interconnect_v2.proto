package NActorsInterconnect;
option java_package = "ru.yandex.kikimr.proto";

message TSystemPayloadV2 {
    message TPingRequest {
    }
    message TPingResponse {
        optional uint64 WallClock = 1; // TInstant::GetValue() for the sending node
    }
    message TPingConfirm {
        optional uint64 WallClock = 1; // TInstant::GetValue() for the sending node
    }
    message TRequest {
        oneof Request {
            TPingRequest PingRequest = 1;
            TPingResponse PingResponse = 2;
            TPingConfirm PingConfirm = 3;
        }
    }
    repeated TRequest Requests = 1;
}
