<text id="c0" x="20" y="70" class="caption">client 1: Lookup(root, &quot;f&quot;) - read requests (green) to directory shard and node shard.</text>
<text id="c1" x="20" y="70" class="caption">client 2: Lookup(root, &quot;f&quot;) - read requests (green) to directory shard and node shard.</text>
<text id="c2" x="20" y="70" class="caption">client 3: Lookup(root, &quot;f&quot;) - read requests (green) to directory shard and node shard.</text>
<text id="c3" x="20" y="70" class="caption">Clients 1-3 reply to Lookup and GetAttr from their caches - no requests to the shards.</text>
<text id="c4" x="20" y="70" class="caption">client 4: SetAttr(node) - modification (blue) to node shard.</text>
<text id="c5" x="20" y="70" class="caption">The shards send invalidations (red) to the subscribers and drop the subscriptions.</text>
<text id="c6" x="20" y="70" class="caption">Clients 1-3 still have the NodeRef cached, but not the Node - Lookup goes to the shards again.</text>
<text id="c7" x="20" y="70" class="caption">client 1: Lookup(root, &quot;f&quot;) - read requests (green) to directory shard and node shard.</text>
<text id="c8" x="20" y="70" class="caption">client 3: Unlink(root, &quot;f&quot;) - modification (blue) to directory shard and node shard.</text>
<text id="c9" x="20" y="70" class="caption">The shards send invalidations (red) to the subscribers and drop the subscriptions.</text>
<text id="c10" x="20" y="70" class="caption">Nothing is cached anymore. The scenario restarts.</text>
</svg>
