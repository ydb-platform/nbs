name: Delete runner VM
description: Delete runner VM using manage-vm.py
inputs:
  repo_owner:
    required: true
    description: "repo owner"
  repo:
    required: true
    description: "repo name"
  service_account_key:
    required: false
    description: "Deprecated legacy Nebius service-account JSON credentials"
  nebius_config_yaml:
    required: false
    description: "Nebius CLI config.yaml content for SDK authentication"
  token:
    required: true
    description: "GITHUB_TOKEN"
  vm_parent_id:
    required: true
    description: "vm parent id"
  vm_id:
    required: true
    description: "vm id"
  vm_labels:
    required: false
    description: "vm labels used to search for cleanup candidates when vm_id is empty"
    default: ""
  vm_require_offline:
    required: false
    description: "Require the GitHub runner to still be offline before deleting its VM"
    default: "false"

runs:
  using: composite
  steps:
    - name: set up nebius cli
      id: nebius-cli
      uses: ./.github/actions/nebius_cli
      with:
        config_yaml: ${{ inputs.nebius_config_yaml }}
        service_account_key: ${{ inputs.service_account_key }}
    - name: install dependencies
      shell: bash
      run: |
        pip install -r .github/scripts/requirements.txt
    - name: remove vm
      id: remove-vm
      shell: bash
      run: |
        export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE/.github
        LABELS_ARG=()
        REQUIRE_OFFLINE_ARG=()
        if [ -n "${VM_LABELS}" ]; then
            LABELS_ARG=(--labels "${VM_LABELS}")
        fi
        if [ "${VM_REQUIRE_OFFLINE}" = "true" ]; then
            REQUIRE_OFFLINE_ARG=(--require-offline)
        fi
        python3 -m scripts.nebius_manage_vm remove \
            --github-repo-owner "${REPO_OWNER}" \
            --github-repo "${REPO}" \
            --parent-id "${PARENT_ID}" \
            --id "${VM_ID}" \
            "${LABELS_ARG[@]}" \
            "${REQUIRE_OFFLINE_ARG[@]}" \
            --apply
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        NEBIUS_IAM_TOKEN: ${{ steps.nebius-cli.outputs.NEBIUS_IAM_TOKEN }}
        REPO_OWNER: ${{ inputs.repo_owner }}
        REPO: ${{ inputs.repo }}
        VM_ID: ${{ inputs.vm_id }}
        VM_LABELS: ${{ inputs.vm_labels }}
        VM_REQUIRE_OFFLINE: ${{ inputs.vm_require_offline }}
        PARENT_ID: ${{ inputs.vm_parent_id }}
