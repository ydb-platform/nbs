name: Build and test proxy

on:
  workflow_call:
    inputs:
      actions_checkout_ref:
        required: false
        type: string
        default: ""
      code_checkout_ref:
        required: false
        type: string
        default: ""
      code_rebase_ref:
        required: false
        type: string
        default: ""
      mode:
        required: true
        type: string
      allow_split_workload:
        required: false
        type: boolean
        default: true
      build_target:
        required: true
        type: string
      test_target:
        required: true
        type: string
      build_preset:
        required: true
        type: string
      run_build:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      target_platform:
        required: false
        type: string
        default: ""
      test_size:
        required: true
        type: string
      test_type:
        required: true
        type: string
      vm_preset:
        required: false
        type: string
        default: ""
      vm_name_suffix:
        required: false
        type: string
        default: ""
      cache_update_build:
        required: true
        type: boolean
      cache_update_tests:
        required: true
        type: boolean
      number_of_retries:
        required: true
        type: number
      test_timeout_minutes:
        required: false
        type: string
        default: ""
        description: "Optional override; leave empty to use the planned per-component timeout"
      sleep_after_tests:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  plan:
    name: Plan split workload
    runs-on: [ self-hosted, "self-hosted", "runner_light" ]
    outputs:
      matrix_include: ${{ steps.build-matrix-include.outputs.matrix_include }}
    steps:
      - name: checkout workflow actions
        uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: '.github'
          clean: true
          ref: ${{ inputs.actions_checkout_ref || inputs.code_checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - name: disable sparse checkout (workaround for actions/checkout/issues/2249)
        if: ${{ always() }}
        run: git config core.sparseCheckout false
        continue-on-error: true
      - name: Build matrix_include
        id: build-matrix-include
        uses: ./.github/actions/nebius_split_workload
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
          TEST_TARGET:  ${{ inputs.test_target }}
          BUILD_PRESET: ${{ inputs.build_preset }}
          TEST_TYPE: ${{ inputs.test_type }}
          TEST_SIZE: ${{ inputs.test_size }}
          NUMBER_OF_RETRIES: ${{ inputs.number_of_retries }}
          NEBIUS_SPLIT_RUNNERS: ${{ inputs.allow_split_workload && vars.NEBIUS_SPLIT_RUNNERS == 'true' && 'true' || 'false' }}
          NEBIUS_SPLIT_RUNNERS_ASAN: ${{ inputs.allow_split_workload && vars.NEBIUS_SPLIT_RUNNERS_ASAN == 'true' && 'true' || 'false' }}
          NEBIUS_SPLIT_RUNNERS_TSAN: ${{ inputs.allow_split_workload && vars.NEBIUS_SPLIT_RUNNERS_TSAN == 'true' && 'true' || 'false' }}
          NEBIUS_SPLIT_RUNNERS_MSAN: ${{ inputs.allow_split_workload && vars.NEBIUS_SPLIT_RUNNERS_MSAN == 'true' && 'true' || 'false' }}
          NEBIUS_SPLIT_RUNNERS_UBSAN: ${{ inputs.allow_split_workload && vars.NEBIUS_SPLIT_RUNNERS_UBSAN == 'true' && 'true' || 'false' }}

  prepare-pr-comment:
    name: Prepare PR comment
    runs-on: [ self-hosted, "self-hosted", "runner_light" ]
    needs: plan
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    steps:
      - name: checkout workflow actions
        uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: '.github'
          clean: true
          ref: ${{ inputs.actions_checkout_ref || inputs.code_checkout_ref || github.event.pull_request.head.sha || github.sha }}
      - name: disable sparse checkout (workaround for actions/checkout/issues/2249)
        if: ${{ always() }}
        run: git config core.sparseCheckout false
        continue-on-error: true
      - name: initialize workload comment
        uses: ./.github/actions/workload_comment
        with:
          command: init
          matrix_include: ${{ needs.plan.outputs.matrix_include }}
          build_preset: ${{ inputs.build_preset }}
          target_platform: ${{ inputs.target_platform }}
          workload_status: in_progress

  on_demand:
    if: ${{ !cancelled() && inputs.mode == 'on_demand' && needs.plan.result == 'success' && (needs.prepare-pr-comment.result == 'success' || needs.prepare-pr-comment.result == 'skipped') }}
    uses: ./.github/workflows/on_demand_build_and_test.yaml
    name: On-demand build and test
    needs:
      - plan
      - prepare-pr-comment
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_include) }}
    with:
      actions_checkout_ref: ${{ inputs.actions_checkout_ref }}
      code_checkout_ref: ${{ inputs.code_checkout_ref }}
      code_rebase_ref: ${{ inputs.code_rebase_ref }}
      component: ${{ matrix.component == 'all' && '' || matrix.component }}
      build_target: ${{ matrix.build_target }}
      test_target:  ${{ matrix.test_target }}
      build_preset: ${{ matrix.build_preset }}
      run_build: ${{ inputs.run_build }}
      run_tests: ${{ inputs.run_tests }}
      target_platform: ${{ inputs.target_platform }}
      test_size:    ${{ inputs.test_size }}
      test_type:    ${{ matrix.test_type }}
      vm_preset:    ${{ inputs.vm_preset != '' && inputs.vm_preset || ( inputs.allow_split_workload == false && vars.POOLED_HEAVY_VM_PRESET_SPLIT || vars.POOLED_HEAVY_VM_PRESET ) }}
      vm_name_suffix: "${{ inputs.vm_name_suffix }}${{ matrix.vm_name_suffix }}"
      cache_update_build: ${{ inputs.cache_update_build }}
      cache_update_tests: ${{ inputs.cache_update_tests }}
      number_of_retries: ${{ matrix.number_of_retries }}
      test_timeout_minutes: ${{ inputs.test_timeout_minutes || matrix.test_timeout_minutes || '390' }}
      sleep_after_tests: ${{ inputs.sleep_after_tests }}
    secrets: inherit

  pooled:
    if: ${{ !cancelled() && inputs.mode == 'pooled' && needs.plan.result == 'success' && (needs.prepare-pr-comment.result == 'success' || needs.prepare-pr-comment.result == 'skipped') }}
    uses: ./.github/workflows/on_pooled_build_and_test.yaml
    name: Pooled build and test
    needs:
      - plan
      - prepare-pr-comment
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_include) }}
    with:
      actions_checkout_ref: ${{ inputs.actions_checkout_ref }}
      code_checkout_ref: ${{ inputs.code_checkout_ref }}
      code_rebase_ref: ${{ inputs.code_rebase_ref }}
      component: ${{ matrix.component == 'all' && '' || matrix.component }}
      build_target: ${{ matrix.build_target }}
      test_target:  ${{ matrix.test_target }}
      build_preset: ${{ matrix.build_preset }}
      run_build: ${{ inputs.run_build }}
      run_tests: ${{ inputs.run_tests }}
      target_platform: ${{ inputs.target_platform }}
      test_size:    ${{ inputs.test_size }}
      test_type:    ${{ matrix.test_type }}
      vm_name_suffix: "${{ inputs.vm_name_suffix }}${{ matrix.vm_name_suffix }}"
      cache_update_build: ${{ inputs.cache_update_build }}
      cache_update_tests: ${{ inputs.cache_update_tests }}
      number_of_retries: ${{ matrix.number_of_retries }}
      test_timeout_minutes: ${{ inputs.test_timeout_minutes || matrix.test_timeout_minutes || '390' }}
      sleep_after_tests: ${{ inputs.sleep_after_tests }}
    secrets: inherit

  hybrid:
    if: ${{ !cancelled() && inputs.mode == 'hybrid' && needs.plan.result == 'success' && (needs.prepare-pr-comment.result == 'success' || needs.prepare-pr-comment.result == 'skipped') }}
    uses: ./.github/workflows/on_hybrid_build_and_test.yaml
    name: Hybrid build and test
    needs:
      - plan
      - prepare-pr-comment
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_include) }}
    with:
      actions_checkout_ref: ${{ inputs.actions_checkout_ref }}
      code_checkout_ref: ${{ inputs.code_checkout_ref }}
      code_rebase_ref: ${{ inputs.code_rebase_ref }}
      component: ${{ matrix.component == 'all' && '' || matrix.component }}
      build_target: ${{ matrix.build_target }}
      test_target:  ${{ matrix.test_target }}
      build_preset: ${{ matrix.build_preset }}
      run_build: ${{ inputs.run_build }}
      run_tests: ${{ inputs.run_tests }}
      target_platform: ${{ inputs.target_platform }}
      test_size:    ${{ inputs.test_size }}
      test_type:    ${{ matrix.test_type }}
      vm_preset:    ${{ inputs.vm_preset != '' && inputs.vm_preset || ( inputs.allow_split_workload == false && vars.POOLED_HEAVY_VM_PRESET_SPLIT || vars.POOLED_HEAVY_VM_PRESET ) }}
      vm_name_suffix: "${{ inputs.vm_name_suffix }}${{ matrix.vm_name_suffix }}"
      cache_update_build: ${{ inputs.cache_update_build }}
      cache_update_tests: ${{ inputs.cache_update_tests }}
      number_of_retries: ${{ matrix.number_of_retries }}
      test_timeout_minutes: ${{ inputs.test_timeout_minutes || matrix.test_timeout_minutes || '390' }}
      sleep_after_tests: ${{ inputs.sleep_after_tests }}
    secrets: inherit
