syntax = "proto3";

package NCloud.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/storage/core/protos";

////////////////////////////////////////////////////////////////////////////////

enum EWaitMode
{
    WAIT_MODE_POLL = 0;
    WAIT_MODE_BUSY_WAIT = 1;
    WAIT_MODE_ADAPTIVE_WAIT = 2;
}

message TBufferPool
{
    // Memory chunks of this size will be kept for reuse. Buffers smaller or
    // equal to the ChunkSize will be backed by one of the available chunks
    uint64 ChunkSize = 1;

    // Maximum buffer size that will be backed by a chunk. Anything bigger will
    // spawn a custom chunk that won't be reused
    uint64 MaxChunkAlloc = 2;

    // Number of unused chunks to be kept to speed up allocations
    uint64 MaxFreeChunks = 3;
}

message TRdmaServer
{
    uint32 Backlog = 1;
    // Deprecated, use SendQueueSize and RecvQueueSize instead.
    uint32 QueueSize = 2;
    uint32 MaxBufferSize = 3;
    uint64 KeepAliveTimeout = 4;            // in milliseconds
    EWaitMode WaitMode = 5;
    uint32 PollerThreads = 6;
    uint32 MaxInflightBytes = 7;            // per client
    uint64 AdaptiveWaitSleepDelay = 8;      // in microseconds
    uint64 AdaptiveWaitSleepDuration = 9;   // in microseconds
    bool AlignedDataEnabled = 10;
    uint32 IpTypeOfService = 11;

    // bind to the first non local address of this interface
    string SourceInterface = 12;

    // use ibv_create_qp instead of rdma_create_qp
    bool VerbsQP = 13;

    TBufferPool BufferPool = 14;

    uint32 SendQueueSize = 15;
    uint32 RecvQueueSize = 16;
    bool StrictValidation = 17;

    // Sets the "retry_cnt" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 7].
    optional uint32 QpRetryCount = 18;

    // Sets the "retry_cnt" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 7].
    // 7 means infinite retries.
    optional uint32 QpRnrRetryCount = 19;

    // Sets the "timeout" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 31].
    // The resulting timeout is calculated as 4096*2^{QpTimeout} microseconds.
    // 0 means infinite timeout.
    optional uint32 QpTimeout = 20;

    // Sets the "min_rnr_timer" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 31].
    // See TRdmaClient::QpMinRnrTimer comment for the value reference
    optional uint32 QpMinRnrTimer = 21;
}

message TRdmaClient
{
    // Deprecated, use SendQueueSize and RecvQueueSize instead.
    uint32 QueueSize = 1;
    uint32 MaxBufferSize = 2;
    uint32 PollerThreads = 3;
    EWaitMode WaitMode = 4;
    uint64 AdaptiveWaitSleepDelay = 5;      // in microseconds
    uint64 AdaptiveWaitSleepDuration = 6;   // in microseconds
    bool AlignedDataEnabled = 7;
    uint32 IpTypeOfService = 8;

    // bind to the first non local address of this interface
    string SourceInterface = 9;

    // use ibv_create_qp instead of rdma_create_qp
    bool VerbsQP = 10;

    uint64 MaxReconnectDelay = 11;  // in milliseconds
    uint64 MaxResponseDelay = 12;   // in milliseconds

    TBufferPool BufferPool = 13;

    uint32 SendQueueSize = 14;
    uint32 RecvQueueSize = 15;

    // Timeout for address/route resolution during connect:
    // rdma_resolve_addr + rdma_resolve_route. (in milliseconds)
    uint64 ResolveTimeout = 16;

    // Maximum time we wait for in-flight requests to drain during endpoint
    // flush/shutdown before considering flush "hung". (in milliseconds)
    uint64 FlushTimeout = 17;

    // Sets the "retry_cnt" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 7].
    optional uint32 QpRetryCount = 18;

    // Sets the "retry_cnt" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 7].
    // 7 means infinite retries.
    optional uint32 QpRnrRetryCount = 19;

    // Sets the "timeout" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 31].
    // The resulting timeout is calculated as 4096*2^{QpTimeout} microseconds.
    // 0 means infinite timeout.
    optional uint32 QpTimeout = 20;

    // Sets the "min_rnr_timer" parameter in the "ibv_qp_attr" for
    // "ibv_modify_qp()" function. Valid values are in range [0, 31].
    // IBTA spec actually defines it as a lookup table (in microseconds).
    // 0 - 655360 | 8 - 160   | 16 - 2560  | 24 - 40960
    // 1 - 10     | 9 - 240   | 17 - 3840  | 25 - 61410
    // 2 - 20     | 10 - 320  | 18 - 5120  | 26 - 81920
    // 3 - 30     | 11 - 480  | 19 - 7680  | 27 - 122880
    // 4 - 40     | 12 - 640  | 20 - 10240 | 28 - 163840
    // 5 - 60     | 13 - 960  | 21 - 15360 | 29 - 245760
    // 6 - 80     | 14 - 1280 | 22 - 20480 | 30 - 327680
    // 7 - 120    | 15 - 1920 | 23 - 30720 | 31 - 491520
    optional uint32 QpMinRnrTimer = 21;

    // Use memory windows to invalidate request buffers after completion.
    bool UseMemoryWindows = 22;

    // Size of the memory windows pool. If not specified or 0, will be set to
    // RecvQueueSize * 2.
    uint32 MemoryWindowsPoolSize = 23;
}
