syntax = "proto3";

package NCloud.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/storage/core/protos";

////////////////////////////////////////////////////////////////////////////////
// Codec of a compressed blob.
//
// The values are stored in the blob metadata of blockstore and filestore:
// never renumber or reuse them. Each value identifies a specific
// library/cpp/blockcodecs configuration.
// Keep in sync with CompressionCodecs in
// cloud/storage/core/libs/compression/codec.cpp.

enum ECompressionCodec
{
    COMPRESSION_CODEC_NONE = 0;
    COMPRESSION_CODEC_LZ4_FAST14_SAFE = 1;
    COMPRESSION_CODEC_SNAPPY = 2;
    COMPRESSION_CODEC_ZSTD_3 = 3;
    COMPRESSION_CODEC_ZSTD_1 = 4;
}

////////////////////////////////////////////////////////////////////////////////
// Layout of a compressed blob.
//
// The uncompressed blob is split into chunks, each chunk is compressed
// independently with Codec or is kept raw, and the chunks are stored one
// after another. The message is stored in the blob metadata.

message TBlobCompressionInfo
{
    ECompressionCodec Codec = 1;

    // Maximum uncompressed chunk size in bytes, a multiple of the block size.
    uint32 MaxUncompressedChunkSize = 2;

    // Compressed sizes of the chunks in blob order. Zero means that the chunk
    // is stored raw and occupies its uncompressed size.
    repeated uint32 CompressedChunkSizes = 3;

    // Uncompressed sizes of the chunks in blob order. Each one is a nonzero
    // multiple of the block size and is at most MaxUncompressedChunkSize.
    // Empty if every chunk except the last one is MaxUncompressedChunkSize
    // bytes, see LastUncompressedChunkSize.
    repeated uint32 UncompressedChunkSizes = 4;

    // Uncompressed size of the last chunk: a nonzero multiple of the block
    // size, at most MaxUncompressedChunkSize. Set only if
    // UncompressedChunkSizes is empty.
    optional uint32 LastUncompressedChunkSize = 5;
}
