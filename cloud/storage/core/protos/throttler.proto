syntax = "proto3";

package NCloud.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/storage/core/protos";

////////////////////////////////////////////////////////////////////////////////
// Message tablet throttler information.

message TThrottlerInfo
{
    // Time spent by a request in the throttler queue in us.
    uint64 Delay = 1;

    // Time spent by a request in the shaping queue in us.
    uint64 ShapingDelay = 2;

    // The part of Delay in us that the original performance profile of the
    // disk alone would have imposed. Unset means it was not measured, which
    // differs from zero when Delay is non-zero.
    optional uint64 QuotaDelay = 3;

    // The request was rejected by the throttler and the original performance
    // profile alone would have rejected it too.
    bool QuotaRejected = 4;
}
