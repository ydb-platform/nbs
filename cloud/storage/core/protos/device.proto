syntax = "proto3";

import "cloud/storage/core/protos/error.proto";

package NCloud.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/storage/core/protos";

////////////////////////////////////////////////////////////////////////////////
// Headers.

message TDeviceRequestHeaders
{
    // Client identifier for client detection.
    string ClientId = 1;

    // Request timeout (in milliseconds).
    uint32 RequestTimeout = 2;
}

message TDeviceResponseHeaders
{
}

////////////////////////////////////////////////////////////////////////////////
// Acquire request/response.

message TAcquireDevicesRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // List of device UUIDs to acquire.
    repeated string DeviceUUIDs = 2;

    // Access mode.
    // Let's just assume r/w access for now.
    // EAccessMode AccessMode = 2;
}

message TAcquireDevicesResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;
}

////////////////////////////////////////////////////////////////////////////////
// Release request/response.

message TReleaseDevicesRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // List of device UUIDs to release.
    repeated string DeviceUUIDs = 2;
}

message TReleaseDevicesResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;
}

////////////////////////////////////////////////////////////////////////////////
// Read request/response.

message TDevicePageGroupRef
{
    // The number of the first page in the response relative to the start of
    // the device, starts from 0.
    uint64 FirstPageNo = 1;

    // The number of consecutive pages.
    uint64 PageCount = 2;

    // Logical page size.
    uint32 PageSize = 3;
}

message TReadPagesRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // UUID of the device to read from.
    string DeviceUUID = 2;

    // Requested pages.
    repeated TDevicePageGroupRef PageGroupRefs = 3;
}

message TDevicePageGroup
{
    // The number of the first page in the response relative to the start of
    // the device, starts from 0.
    uint64 FirstPageNo = 1;

    // Page data for each of the response pages.
    repeated bytes Content = 2;
}

message TReadPagesResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;

    // Requested pages.
    repeated TDevicePageGroup PageGroups = 3;
}

////////////////////////////////////////////////////////////////////////////////
// Write request/response.

message TWriteLogRecordRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // UUID of device to write to.
    string DeviceUUID = 2;

    // Pages to write.
    repeated TDevicePageGroup PageGroups = 3;

    // Log sequence number used to order the writes.
    uint64 LogSequenceNumber = 4;

    // Prev log sequence number used to validate order.
    uint64 PrevLogSequenceNumber = 5;
}

message TWriteLogRecordResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;
}

////////////////////////////////////////////////////////////////////////////////
// Journal tail read request/response.

message TJournalRecord
{
    // Pages written by this record.
    repeated TDevicePageGroup PageGroups = 1;

    // Log sequence number this record was written with.
    uint64 LogSequenceNumber = 2;

    // Prev log sequence number used to validate order.
    uint64 PrevLogSequenceNumber = 3;
}

message TReadJournalTailRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // UUID of the device to read the journal from.
    string DeviceUUID = 2;

    // Only the records whose LogSequenceNumber is strictly greater than this
    // value are returned.
    uint64 AfterLogSequenceNumber = 3;

    // Maximum number of records to return. Zero means "no limit".
    uint32 MaxRecordCount = 4;
}

message TReadJournalTailResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;

    // The records still kept in the journal, ordered by LogSequenceNumber.
    repeated TJournalRecord Records = 3;
}

////////////////////////////////////////////////////////////////////////////////
// Lsn low watermark advance request/response.

message TAdvanceLsnLowWatermarkRequest
{
    // Headers.
    TDeviceRequestHeaders Headers = 1;

    // UUID of the device whose watermark is being advanced.
    string DeviceUUID = 2;

    // The records with LogSequenceNumber below this value may be applied to
    // their final locations and dropped from the journal.
    uint64 LsnLowWatermark = 3;
}

message TAdvanceLsnLowWatermarkResponse
{
    // Headers.
    TDeviceResponseHeaders Headers = 1;

    // Optional error, set only if error happened.
    TError Error = 2;
}

////////////////////////////////////////////////////////////////////////////////
// Device protocol request/response wrappers.

message TDeviceProtocolRequest
{
    // Request identifier.
    uint64 RequestId = 1;

    oneof Request {
        TAcquireDevicesRequest AcquireDevices = 2;
        TReleaseDevicesRequest ReleaseDevices = 3;
        TReadPagesRequest ReadPages = 4;
        TWriteLogRecordRequest WriteLogRecord = 5;
        TReadJournalTailRequest ReadJournalTail = 6;
        TAdvanceLsnLowWatermarkRequest AdvanceLsnLowWatermark = 7;
    }
}

message TDeviceProtocolResponse
{
    // Request identifier - used to match this response with its request.
    uint64 RequestId = 1;

    oneof Response {
        NCloud.NProto.TError ProtocolError = 2;

        TAcquireDevicesResponse AcquireDevices = 3;
        TReleaseDevicesResponse ReleaseDevices = 4;
        TReadPagesResponse ReadPages = 5;
        TWriteLogRecordResponse WriteLogRecord = 6;
        TReadJournalTailResponse ReadJournalTail = 7;
        TAdvanceLsnLowWatermarkResponse AdvanceLsnLowWatermark = 8;
    }
}
