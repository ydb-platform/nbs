syntax = "proto2";

package persistence;

option go_package = "github.com/ydb-platform/nbs/cloud/tasks/persistence/config";

////////////////////////////////////////////////////////////////////////////////

message PersistenceConfig {
    required string Endpoint = 1;
    required string Database = 2;
    optional string RootPath = 3;
    optional bool Secure = 4;
    optional string RootCertsFile = 5;
    optional string ConnectionTimeout = 6 [default = "10s"];
    optional bool DisableAuthentication = 7;
    optional S3Config S3Config = 8;
    // Timeout for YDB call, i.e. BeginTransaction, Execute, Commit, etc.
    optional string CallTimeout = 9 [default = "600s"];
}

message S3Config {
    required string Endpoint = 1;
    required string Region = 2;
    optional string CredentialsFilePath = 3;
    optional string CallTimeout = 4 [default = "60s"];
    optional uint64 MaxRetriableErrorCount = 5 [default = 3];
    optional S3ControlPlaneConfig ControlPlaneConfig = 6;
    optional bool UseIamToken = 7;
    // Idle keep-alive connections kept per host. 0 keeps the Go default of 2,
    // which reopens a TLS connection for almost every concurrent request.
    optional uint64 MaxIdleConnsPerHost = 8;
    // Attempts of PutObject per second of this client, retries included.
    // Keeps a request quota of the storage whatever the size of the objects.
    // 0 does not limit them.
    optional uint64 MaxPutObjectAttemptsPerSecond = 20;
    // With a value below the maximum the rate adapts between the two to the
    // throttling of the storage (429, SlowDown): down after a second with a
    // throttled attempt, up otherwise. Hosts sharing a quota settle at their
    // shares of it. 0 keeps the rate at the maximum.
    optional uint64 MinPutObjectAttemptsPerSecond = 23;
    // Bounds of the pause before a throttled request (429, SlowDown) is
    // retried; the pause doubles on every retry. Empty keeps the SDK
    // defaults, 500ms and 300s.
    optional string MinThrottleRetryDelay = 21;
    optional string MaxThrottleRetryDelay = 22;
}

message S3ControlPlaneConfig {
    required string Endpoint = 1;
    optional string CallTimeout = 2 [default = "60s"];
}
