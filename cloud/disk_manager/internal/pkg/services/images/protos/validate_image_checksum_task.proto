syntax = "proto3";

package images;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/images/protos";

////////////////////////////////////////////////////////////////////////////////

message ValidateImageChecksumRequest {
    string ImageId = 1;
}

message ValidateImageChecksumResponse {
    uint32 Checksum = 1;
}

message ValidateImageChecksumTaskState {
    // Id of the dataplane.ComputeSnapshotChecksum task.
    string ComputeChecksumTaskId = 1;
    // Checksum computed by that task. It is set when the task is finished,
    // so it is known even if it does not match the saved one.
    uint32 Checksum = 2;
}
