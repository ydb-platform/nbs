syntax = "proto3";

package images;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/images/protos";

////////////////////////////////////////////////////////////////////////////////

message BackupImageRequest {
    string ImageId = 1;
    // The attempt in images/backup_queue; empty for an attempt queued by the
    // previous version.
    string BackupId = 2;
}

message BackupImageTaskState {
    string DataplaneTaskID = 1;
    bytes EncryptedDek = 2;
}
