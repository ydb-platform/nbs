syntax = "proto3";

package snapshots;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

////////////////////////////////////////////////////////////////////////////////

message ValidateSnapshotChecksumRequest {
    string SnapshotId = 1;
}

message ValidateSnapshotChecksumResponse {
    uint32 Checksum = 1;
}

message ValidateSnapshotChecksumTaskState {
    // Id of the dataplane.ComputeSnapshotChecksum task.
    string ComputeChecksumTaskId = 1;
    // Checksum computed by that task. It is set when the task is finished,
    // so it is known even if it does not match the saved one.
    uint32 Checksum = 2;
}
