syntax = "proto3";

package snapshots;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

////////////////////////////////////////////////////////////////////////////////

message SaveSnapshotChecksumRequest {
    string SnapshotId = 1;
}

message SaveSnapshotChecksumResponse {
    uint32 Checksum = 1;
}

message SaveSnapshotChecksumTaskState {
    // Id of the dataplane.ComputeSnapshotChecksum task.
    string ComputeChecksumTaskId = 1;
    // Checksum computed by that task. It is set when the task is finished,
    // so it is known even if the checksum is not saved afterwards.
    uint32 Checksum = 2;
    // Id of the task that has created the snapshot. It is set when this task
    // sees the snapshot for the first time: a snapshot that is deleted and
    // created again with the same id is another snapshot.
    string SnapshotCreateTaskId = 3;
}
