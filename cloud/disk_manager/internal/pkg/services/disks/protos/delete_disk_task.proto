syntax = "proto3";

package disks;

import "cloud/disk_manager/internal/pkg/types/types.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/disks/protos";

////////////////////////////////////////////////////////////////////////////////

message DeleteDiskRequest {
    reserved 2;

    types.Disk Disk = 1;
    bool Sync = 3;
    // Delete the disk from Blockstore even if it is missing from the Disk
    // Manager database (needed for legacy-created local disks).
    bool DeleteIfNonExistent = 4;
    // Persist the selected mode so retries do not switch paths after config changes.
    bool BackgroundCleanup = 5;
}

message DeleteDiskTaskState {
    repeated string CleanupCellIds = 1;
    bool CleanupPrepared = 2;
    string LegacyCleanupRegistrationTaskId = 3;
    bool LegacyCleanupRegistered = 4;
}

message DeleteDiskFromCellRequest {
    types.Disk Disk = 1;
    bool Sync = 2;
    string CleanupId = 3;
}

message FinishLegacyDiskCleanupRequest {
    string DiskId = 1;
    string LegacyTaskId = 2;
    string CleanupId = 3;
}

message RegisterLegacyDiskCleanupTaskState {
    string AfterTaskId = 1;
}
