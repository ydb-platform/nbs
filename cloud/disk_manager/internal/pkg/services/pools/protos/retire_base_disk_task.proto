syntax = "proto3";

package pools;

import "cloud/disk_manager/internal/pkg/types/types.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/pools/protos";

////////////////////////////////////////////////////////////////////////////////

message RetireBaseDiskRequest {
    reserved 3;

    string BaseDiskId = 1;
    types.Disk SrcDisk = 2;
    uint64 UseImageSize = 4;
    // Use the retiring disk as source; mutually exclusive with SrcDisk.
    // Requires HoldBaseDisksWithInflightDependents on the executing worker.
    bool UseBaseDiskAsSrc = 5;
}

message RetireBaseDiskTaskState {
    reserved 2 to 3;
}
