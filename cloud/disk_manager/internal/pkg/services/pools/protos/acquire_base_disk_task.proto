syntax = "proto3";

package pools;

import "cloud/disk_manager/internal/pkg/types/types.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/pools/protos";

////////////////////////////////////////////////////////////////////////////////

message AcquireBaseDiskRequest {
    string SrcImageId = 1;
    types.Disk OverlayDisk = 2;
    types.DiskKind OverlayDiskKind = 3;
    uint64 OverlayDiskSize = 4;
    // Expected read bandwidth of the overlay disk. When set, the base disk
    // slot is charged by bandwidth rather than by the overlay disk size
    // (OverlayDiskSize and OverlayDiskKind are ignored): as many base disk
    // allocation units as needed to provide this bandwidth, without any
    // oversubscription. Meant for overlay disks that read the base disk at
    // full speed, e.g. proxy overlay disks of disks.CreateDiskFromBaseDisk
    // task.
    uint64 ExpectedReadBandwidthMiBs = 5;
}

message AcquireBaseDiskResponse {
    string BaseDiskId = 1;
    string BaseDiskCheckpointId = 2;
}

message AcquireBaseDiskTaskState {
    types.Disk BaseDisk = 2;
    string BaseDiskCheckpointId = 3;
    uint32 Step = 4;
}
