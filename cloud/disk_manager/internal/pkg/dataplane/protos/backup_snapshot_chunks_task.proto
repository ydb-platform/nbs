syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message BackupSnapshotChunksRequest {
    string SnapshotId = 1;
}

message BackupSnapshotChunksTaskState {
    uint32 MilestoneChunkIndex = 1;
    uint32 ChunkCount = 2;
    uint32 EnqueuedChunkCount = 3;
}
