syntax = "proto3";

package dataplane;

import "cloud/disk_manager/internal/pkg/types/types.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message TransferFromDiskToDiskRequest {
    types.Disk SrcDisk = 1;
    string SrcDiskCheckpointId = 2;
    types.Disk DstDisk = 3;
    string SrcDiskBaseCheckpointId = 4;
    uint64 FillGeneration = 5;
    uint64 FillSeqNumber = 6;
    // Mount SrcDisk locally (VOLUME_MOUNT_LOCAL) instead of remotely. Local
    // mount moves the SrcDisk tablet to the NBS node that serves the dataplane
    // session, so it is meant for one-shot disks only (e.g. proxy overlay
    // disks), not for user disks.
    bool MountSrcDiskLocally = 7;
    // Transfer the first MaxSizeBytes of SrcDisk only (rounded up to the
    // block size of SrcDisk), zero means the whole disk.
    //
    // An optimization that limits how much data is enumerated, and therefore
    // the number of |GetChangedBlocks| calls, before the task persists its
    // progress.
    //
    // Should be set when DstDisk is smaller than SrcDisk and the data is known
    // to fit into DstDisk.
    uint64 MaxSizeBytes = 8;
}

message TransferFromDiskToDiskTaskState {
    uint32 MilestoneChunkIndex = 2;
    uint32 TransferredChunkCount = 5;
    double Progress = 4;
    uint32 ChunkCount = 3;
}

message TransferFromDiskToDiskMetadata {
    double Progress = 1;
}
