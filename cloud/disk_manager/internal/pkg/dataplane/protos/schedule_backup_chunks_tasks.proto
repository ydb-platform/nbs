syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message ScheduleBackupChunksTasksState {
    // Were WorkerTaskIds and ScheduledCount of the dispatcher without ranges.
    reserved 1, 2;

    // Number of shard ranges the fields below are for.
    uint32 RangeCount = 3;
    // The copy task of each range; empty when the range has none.
    repeated string RangeTaskIds = 4;
    // Copy tasks scheduled so far for each range. The idempotency key of the
    // next task of the range includes it.
    repeated uint64 RangeScheduledCounts = 5;
    // The range the next pass starts from, so that every range gets a turn.
    uint32 NextRange = 6;
}
