syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message RelocateSnapshotDataFromYDBToS3Request {
  string SnapshotId = 1;
}

message RelocateSnapshotDataFromYDBToS3TaskState {
  uint32 MilestoneChunkIndex = 1;
  double Progress = 2;
  uint32 ChunkCount = 3;
}

message RelocateSnapshotDataFromYDBToS3Metadata {
  double Progress = 1;
}

message RelocateSnapshotDataFromYDBToS3Response {
}
