syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message BackupSnapshotDataRequest {
    string SnapshotId = 1;
    bytes EncryptedDek = 2;
}

message BackupSnapshotDataTaskState {
    uint32 MilestoneChunkIndex = 1;
    uint32 ChunkCount = 2;
    bool ChunkMapBackedUp = 4;
}
