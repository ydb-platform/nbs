syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message RelocateSnapshotsDataFromYDBToS3Request {
  // 0 means use config default.
  uint32 InflightLimit = 1;
  // Propagated to child RelocateSnapshotChunksToS3Task. 0 means child uses
  // its own config default.
  uint32 WorkerCount = 2;
}

message RelocateSnapshotsDataFromYDBToS3TaskState {
  repeated string inflightSnapshots = 1;
}
