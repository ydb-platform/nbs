syntax = "proto2";

package dataplane;

import "cloud/disk_manager/internal/pkg/dataplane/filesystem/config/config.proto";
import "cloud/disk_manager/internal/pkg/dataplane/snapshot/config/config.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/config";

////////////////////////////////////////////////////////////////////////////////

message DataplaneConfig {
    required snapshot.SnapshotConfig SnapshotConfig = 1;

    optional uint32 ReaderCount = 2 [default = 10];
    optional uint32 WriterCount = 3 [default = 10];
    optional uint32 ChunksInflightLimit = 4 [default = 100];

    optional string SnapshotCollectionTimeout = 5 [default = "30m"];
    optional string CollectSnapshotsTaskScheduleInterval = 6 [default = "1m"];
    optional uint32 SnapshotCollectionInflightLimit = 7 [default = 10];

    optional uint32 CreateSnapshotFromURLReaderCount = 8 [default = 10];
    optional string HTTPClientTimeout = 9 [default = "60s"];
    optional string HTTPClientMinRetryTimeout = 10 [default = "1s"];
    optional string HTTPClientMaxRetryTimeout = 11 [default = "8s"];
    optional uint32 HTTPClientMaxRetries = 12 [default = 5];

    optional string CollectSnapshotMetricsTaskScheduleInterval = 13 [default = "10m"];
    optional string SnapshotMetricsCollectionInterval = 14 [default = "1m"];

    // Abort replication if SecondsRemaining degrades in X iterations.
    optional uint32 UselessReplicationIterationsBeforeAbort = 15 [default = 100];

    optional string ProxyOverlayDiskIdPrefix = 16 [default = "proxy-"];
    optional snapshot.SnapshotConfig MigrationDstSnapshotConfig = 17;
    optional uint32 MigratingSnapshotsInflightLimit = 18 [default = 10];

    optional int64 ReplicationBetweenCellsSecondsRemainingThreshold = 19 [default = 300];

    optional filesystem_dataplane.FilesystemDataplaneConfig FilesystemConfig = 20;

    optional string BackupChunksTaskScheduleInterval = 21 [default = "10s"];
    // Number of chunks of a snapshot added to or removed from the backup chunk
    // queue at a time.
    optional uint32 BackupSnapshotDataBatchSize = 22 [default = 1000];
    // Number of chunks taken from the backup chunk queue at a time to be copied
    // to the follower bucket.
    optional uint32 BackupChunksTaskBatchSize = 23 [default = 100];
    // Number of chunks one dataplane.BackupChunks task copies to the follower
    // bucket at the same time.
    optional uint32 BackupChunksTaskIoDepth = 24 [default = 10];

    optional string DeleteBackupChunksTaskScheduleInterval = 25 [default = "10s"];
    // Number of chunks taken from the backup chunk delete queue at a time to
    // be deleted from the follower bucket.
    optional uint32 DeleteBackupChunksTaskBatchSize = 26 [default = 1000];
    // Maximum number of chunks deleted from the follower bucket at the same
    // time.
    optional uint32 DeleteBackupChunksInflightLimit = 27 [default = 10];

    // Maximum number of dataplane.BackupChunks tasks the dispatcher keeps
    // running. One task per node is enough when
    // TasksConfig.InflightTaskPerNodeLimits caps the type at one.
    optional uint32 BackupChunksTasksLimit = 28 [default = 1];
    // Bytes per second one node sends to the follower bucket, in MiB.
    // 0 disables the limit.
    optional uint64 BackupBandwidthMiBs = 29 [default = 0];
    // A copier returns after this long, so that the dispatcher places a
    // fresh one through the regular listing, which honours
    // TasksConfig.InflightTaskPerNodeLimits.
    optional string BackupChunksTaskLifetime = 30 [default = "10m"];
}
