syntax = "proto3";

package dataplane_filesystem_snapshot;

import "cloud/disk_manager/internal/pkg/types/types.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/filesystem/snapshot/protos";

////////////////////////////////////////////////////////////////////////////////

message TransferFromSnapshotToFilesystemRequest {
    types.Filesystem Filesystem = 1;
    string SnapshotId = 2;
}

message HardLinksRestoreCookie {
    uint64 NodeId = 1;
    uint64 ParentNodeId = 2;
    string Name = 3;
}

message TransferFromSnapshotToFilesystemTaskState {
    bool RootNodeScheduled = 1;

    // Field 2 replaces the legacy int64 HardlinksRestoreOffset.
    // Compatibility with legacy state, including retrieval through
    // dataplane/admin APIs, is intentionally not guaranteed.
    // No migration is provided.
    HardLinksRestoreCookie HardLinksRestoreCookie = 2;
    bool HardlinksRestored = 3;
}
