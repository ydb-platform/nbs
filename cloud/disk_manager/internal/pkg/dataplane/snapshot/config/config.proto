syntax = "proto2";

package snapshot;

import "cloud/tasks/persistence/config/config.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/snapshot/config";

////////////////////////////////////////////////////////////////////////////////

message SnapshotConfig {
    required persistence.PersistenceConfig PersistenceConfig = 1;
    optional string StorageFolder = 2 [default = "snapshot"];
    optional uint64 ChunkBlobsTableShardCount = 3 [default = 10000];
    optional uint64 ChunkMapTableShardCount = 4 [default = 1000];
    optional string ExternalBlobsMediaKind = 5 [default = "rotencrypted"];
    optional uint32 DeleteWorkerCount = 6 [default = 100];
    optional uint32 ShallowCopyWorkerCount = 7 [default = 100];
    optional uint32 ShallowCopyInflightLimit = 8 [default = 1000];
    optional string ChunkCompression = 9 [default = "lz4"];
    optional string S3Bucket = 10;
    optional string ChunkBlobsS3KeyPrefix = 11 [default = "snapshot/chunks"];
    map<string, uint32> ProbeCompressionPercentage = 12;  // by codec
    optional string S3BucketId = 13;  // bucket id for controlplane operations (e.g. fetching metrics)
}
