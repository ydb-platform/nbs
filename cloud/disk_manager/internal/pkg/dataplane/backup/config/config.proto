syntax = "proto2";

package backup;

import "cloud/tasks/persistence/config/config.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/backup/config";

////////////////////////////////////////////////////////////////////////////////

message SnapshotStorageBackupConfig {
    required persistence.S3Config S3Config = 1;
    required string S3Bucket = 2;
    optional string S3KeyPrefix = 3;
    optional string KekFile = 4;
    optional string KekId = 5;
    // New ready snapshots of these folders are queued for backup.
    repeated string FolderIds = 6;
    // Bytes per second one host writes to the bucket, in MiB, whatever the
    // number of copy tasks on it. 0 disables the limit.
    optional uint64 UploadBandwidthMiBsPerHost = 7;
}
