syntax = "proto3";

import "cloud/storage/core/protos/error.proto";
import "cloud/filestore/public/api/protos/headers.proto";
import "cloud/filestore/public/api/protos/node.proto";

package NCloud.NFileStore.NProtoPrivate;

option go_package = "github.com/ydb-platform/nbs/cloud/filestore/private/api/unsafe_protos";

////////////////////////////////////////////////////////////////////////////////
// Direct inode and node ref manipulation.

message TUnsafeCreateNodeRequest
{
    string FileSystemId = 1;
    NProto.TNodeAttr Node = 2;
    bytes SymLink = 3;
}

message TUnsafeCreateNodeResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;
}

message TUnsafeCreateNodeRefRequest
{
    string FileSystemId = 1;
    uint64 ParentId = 2;
    bytes Name = 3;
    uint64 ChildId = 4;
    string ShardId = 5;
    string ShardNodeName = 6;
}

message TUnsafeCreateNodeRefResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;
}

////////////////////////////////////////////////////////////////////////////////
// UnsafeChangeTabletState request/response.

message TUnsafeChangeTabletStateRequest
{
    // FileSystem identifier.
    string FileSystemId = 1;

    // If set, only unsafe ops will be allowed.
    optional bool Frozen = 2;

    // Compress ShardId and ShardNodeName when we write them to NodeRefs table.
    optional bool CompressNodeRef = 3;
}

message TUnsafeChangeTabletStateResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;
}

////////////////////////////////////////////////////////////////////////////////
// GetFileSystemTopology request/response.

message TGetFileSystemTopologyRequest
{
    // Optional request headers.
    NProto.THeaders Headers = 1;

    // FileSystem identifier to query its topology.
    string FileSystemId = 2;
}

message TGetFileSystemTopologyResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;

    // Shard FileSystem identifiers.
    repeated string ShardFileSystemIds = 2;

    // Shard no (if this fs is a shard itself).
    uint32 ShardNo = 3;

    bool DirectoryCreationInShardsEnabled = 4;

    bool StrictFileSystemSizeEnforcementEnabled = 5;

    uint32 MaxShardCount = 6;

    bool ForceDirectoryCreationInShards = 7;

    // Shard FileSystem identifiers for regular files.
    repeated string FileShardFileSystemIds = 8;

    bool CompressNodeRef = 9;

    // Main FileSystem identifier.
    string MainFileSystemId = 10;

    // Number of nodes used by this FileSystem tablet, excluding its shards.
    uint64 UsedNodesCount = 11;
}

////////////////////////////////////////////////////////////////////////////////
// ConfigureShards request/response.

message TConfigureShardsRequest
{
    // FileSystem identifier.
    string FileSystemId = 1;

    // Shard FileSystem identifiers.
    repeated string ShardFileSystemIds = 2;

    // Override shard list validation.
    bool Force = 3;

    // Make it possible to create directories in shards.
    bool DirectoryCreationInShardsEnabled = 4;

    // Allow shards aggregate statistics from all other shards and strictly
    // enforce filesystem size.
    bool StrictFileSystemSizeEnforcementEnabled = 5;

    // If DirectoryCreationInShardsEnabled is true, forces directory creation
    // in shards even if main tablet has already created some nodes.
    bool ForceDirectoryCreationInShards = 6;

    // Shard FileSystem identifiers for regular files. If empty, then
    // ShardFileSystemIds will be used for regular files.
    repeated string FileShardFileSystemIds = 7;
}

message TConfigureShardsResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;
}

////////////////////////////////////////////////////////////////////////////////
// FastShard config.
//
// Experimental. This API is subject to change in the future.

message TStorageDevice
{
    string Host = 1;
    uint32 Port = 2;
    string DeviceId = 3;
}

message TStorageGroup
{
    enum EStorageGroupType
    {
        E_SG_MIRROR = 0;
    };

    repeated TStorageDevice Devices = 1;
    EStorageGroupType Type = 2;
}

message TPersistentFastShardConfig
{
    repeated TStorageGroup StorageGroups = 1;
    uint64 NodesPerGroup = 2;
    uint64 ExpectedGroupCapacity = 3;

    // Retry policy for storage node requests. Zero values mean defaults:
    // 5min total timeout, 500ms backoff increment.
    uint64 RetryTotalTimeoutMs = 4;
    uint64 RetryBackoffIncrementMs = 5;
}

message TMemFastShardConfig
{
    bool CreateNodeUponAccess = 1;
}

message TFastShardConfig
{
    oneof Config
    {
        TPersistentFastShardConfig PersistentConfig = 1;
        TMemFastShardConfig MemConfig = 2;
    }
}

////////////////////////////////////////////////////////////////////////////////
// ConfigureAsShard request/response.

message TConfigureAsShardRequest
{
    // FileSystem identifier.
    string FileSystemId = 1;

    // ShardNo (will be used for the high bits of NodeId and HandleId)
    uint32 ShardNo = 2;

    // Shard FileSystem identifiers and main FileSystem identifier (manages
    // RootNode). Needed for directory creation in shards.
    repeated string ShardFileSystemIds = 3;
    string MainFileSystemId = 4;

    // Make it possible to create directories in shards.
    bool DirectoryCreationInShardsEnabled = 5;

    // Allow shards aggregate statistics from all other shards and strictly
    // enforce filesystem size.
    bool StrictFileSystemSizeEnforcementEnabled = 6;

    // If DirectoryCreationInShardsEnabled is true, forces directory creation
    // in shards even if main tablet has already created some nodes.
    bool ForceDirectoryCreationInShards = 7;

    // Shard FileSystem identifiers for regular files. If empty, then
    // ShardFileSystemIds will be used for regular files.
    repeated string FileShardFileSystemIds = 8;

    // Override shard list validation.
    bool Force = 9;

    // If set, this shard will work in "fast shard" mode and will use
    // FastShardConfig to determine where and how to store the files instead of
    // using BlobStorage.
    bool IsFastShard = 10;
    TFastShardConfig FastShardConfig = 11;
}

message TConfigureAsShardResponse
{
    // Optional error, set only if error happened.
    NCloud.NProto.TError Error = 1;
}
