syntax = "proto3";

import "cloud/filestore/public/api/protos/data.proto";

package NCloud.NFileStore.NProto;

message TQueuedCreateHandleRequest
{
    // Node that the handle belongs to.
    fixed64 NodeId = 1;

    // Handle returned by the asynchronous CreateHandle.
    fixed64 Handle = 2;

    // Flags of the original CreateHandle request.
    uint32 Flags = 3;

    // Request id of the original CreateHandle request.
    uint64 OriginalRequestId = 4;
}

message TQueueEntry
{
     oneof Request {
          TQueuedCreateHandleRequest QueuedCreateHandleRequest = 1;
          TDestroyHandleRequest DestroyHandleRequest = 2;
    }
}
