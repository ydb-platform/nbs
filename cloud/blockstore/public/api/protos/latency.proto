syntax = "proto2";

package NCloud.NBlockStore.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/public/api/protos";

// Version 2 summarizes one complete execution scope. TotalUs is observed time;
// AdjustedUs preserves service work and gaps while removing only confirmed
// purchased-profile waits, including their effect on parallel critical paths.
message TLatencyDiagnostics
{
    optional uint32 Version = 1;
    optional bool Complete = 2;
    optional uint64 TotalUs = 3;

    // Version 1 carried an execution graph. Never reinterpret that wire field.
    reserved 4;
    reserved "Nodes";

    enum EQuotaReason
    {
        UNCONFIRMED = 0;
        PROFILE_IOPS = 1;
        PROFILE_BANDWIDTH = 2;
        PROFILE_BURST = 3;
        PROFILE_LIMIT = 4;
    }

    enum EExclusion
    {
        NONE = 0;
        INVALID_CLIENT_REQUEST = 1;
        CLIENT_CANCELLATION = 2;
        CLIENT_LIMIT = 3;
    }
    // A confirmed origin, supplied by trusted NBS instrumentation. A generic
    // cancellation/throttling error code is not sufficient evidence.
    optional EExclusion Exclusion = 5;
    optional uint64 AdjustedUs = 6;
}
