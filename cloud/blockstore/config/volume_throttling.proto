syntax = "proto2";

package NCloud.NBlockStore.NProto;

import "cloud/blockstore/public/api/protos/volume_throttling.proto";
import "cloud/storage/core/config/markers.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/config";

message TVolumeThrottlingServiceConfig
{
    repeated TVolumeThrottlingRule Rules = 1 [(NCloud.NMarkers.AllowRuntimeUpdate) = true];
}
