syntax = "proto2";

import "cloud/storage/core/config/markers.proto";

package NCloud.NBlockStore.NProto;

import "cloud/storage/core/protos/authorization_mode.proto";
import "cloud/storage/core/protos/certificate.proto";
import "cloud/storage/core/protos/config_dispatcher_settings.proto";
import "cloud/storage/core/protos/diagnostics.proto";
import "cloud/storage/core/protos/media.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/config";

////////////////////////////////////////////////////////////////////////////////

enum EChannelAllocationMode
{
    // [obsolete]
    // Send NumChannels+ChannelProfileId settings to schemeshard in CreateVolume
    // and AlterVolume requests
    // CA_IMPLICIT = 0;

    // [obsolete]
    // Send ExplicitChannelProfiles alongside NumChannels+ChannelProfileId
    // CA_BOTH = 1;

    // Send only ExplicitChannelProfiles
    CA_EXPLICIT = 2;
}

////////////////////////////////////////////////////////////////////////////////

enum ECompactionType
{
    // RangeScore = BlobCount
    CT_DEFAULT = 0;
    // RangeScore = blobstorage load reduction in seconds
    CT_LOAD = 1;
}

////////////////////////////////////////////////////////////////////////////////

// Keep consistent with copy from contrib/ydb/core/protos/nbs/blockstore.proto
enum EVolumePreemptionType
{
    // Do not preempt volumes when host is overloaded
    PREEMPTION_NONE = 0;
    // Move most resource consuming disk
    PREEMPTION_MOVE_MOST_HEAVY = 1;
    // Move least resource consumig disk
    PREEMPTION_MOVE_LEAST_HEAVY = 2;
}

message TLinkedDiskFillBandwidth
{
    optional NCloud.NProto.EStorageMediaKind MediaKind = 1;

    // Max linked disk fill bandwidth in MiB/s when used as source.
    optional uint32 ReadBandwidth = 2;

    // Max linked disk fill bandwidth in MiB/s when used as destination.
    optional uint32 WriteBandwidth = 3;

    // Max linked disk fill io depth when used as source.
    optional uint32 ReadIoDepth = 4;

    // Max linked disk fill io depth when used as destination.
    optional uint32 WriteIoDepth = 5;
}

////////////////////////////////////////////////////////////////////////////////

enum EResyncPolicy
{
    // Fix only minor mismatches by 4MiB range.
    RESYNC_POLICY_MINOR_4MB = 0;

    // Fix minor and replace major mismatches by 4MiB range.
    RESYNC_POLICY_MINOR_AND_MAJOR_4MB = 1;

    // Fix only minor mismatches with block size range.
    RESYNC_POLICY_MINOR_BLOCK_BY_BLOCK = 2;

    // Fix minor and replace major mismatches with block size range.
    RESYNC_POLICY_MINOR_AND_MAJOR_BLOCK_BY_BLOCK = 3;
}

////////////////////////////////////////////////////////////////////////////////

enum ENonreplAllocationPolicy
{
    NONREPL_ALLOC_POLICY_NOT_SPECIFIED = 0;

    // Try to allocate disk devices of the same user on different hosts if possible.
    NONREPL_ALLOC_POLICY_USER_ANTI_AFFINITY = 1;
}

enum EOverlappingRequestsPolicy
{
    // Overlapping requests are processed as usual.
    ORP_ENABLE = 0;

    // Overlapping requests are processed as usual, but when an overlapping
    // request appears, the CritEvent raised.
    ORP_ENABLE_WITH_CRIT_EVENT = 1;

    // Protection against overlapping requests is disabled. It is assumed that
    // the protection is implemented on couple layers above volume.
    ORP_DISABLE = 2;
}

enum ERequestSplitterPolicy
{
    // Read/write/zero requests are split by TVolumeActor as usual.
    RSP_ENABLE = 0;

    // Read/write/zero requests are split by TVolumeActor as usual, but when a
    // cross-partition request appears, the CritEvent raised.
    RSP_ENABLE_WITH_CRIT_EVENT = 1;

    // Splitting of read/write/zero requests in TVolumeActor is disabled. It is
    // assumed that the splitting is implemented on couple layers above volume.
    RSP_DISABLE = 2;
}

////////////////////////////////////////////////////////////////////////////////

message TPoolKindToMediaKindMapping
{
    // YDB storage pool kind.
    optional string PoolKind = 1;

    // Corresponding NBS storage media kind
    optional NCloud.NProto.EStorageMediaKind MediaKind = 2;
}

////////////////////////////////////////////////////////////////////////////////

message TShapingThrottlerQuota
{
    // Performance profile for write requests.
    optional NCloud.NProto.TPerformanceProfile Write = 1;

    // Performance profile for read requests.
    optional NCloud.NProto.TPerformanceProfile Read = 2;

    // Number of IOs that are expected to be processed in parallel.
    optional uint32 ExpectedIoParallelism = 3;

    // The maximum amount of "budget" that can accumulate in the bucket
    // (in milliseconds).
    optional uint32 MaxBudget = 4;

    // The time it takes to fully refill the bucket from empty
    // (in milliseconds).
    optional uint32 BudgetRefillTime = 5;

    // The speed of budget consumption. All unspent budget will become shaping
    // wait time (1.0 - no budget consumption, 2.0 - consume budget at 2x rate).
    optional double BudgetSpendRate = 6;
};

////////////////////////////////////////////////////////////////////////////////

message TShapingThrottlerConfig
{
    // Performance measurements coefficients for SSD.
    optional TShapingThrottlerQuota SsdQuota = 1;

    // Performance measurements coefficients for HDD.
    optional TShapingThrottlerQuota HddQuota = 2;

    // Performance measurements coefficients for NRD.
    optional TShapingThrottlerQuota NonreplQuota = 3;

    // Performance measurements coefficients for mirror2 disks.
    optional TShapingThrottlerQuota Mirror2Quota = 4;

    // Performance measurements coefficients for mirror3 disks.
    optional TShapingThrottlerQuota Mirror3Quota = 5;
}

////////////////////////////////////////////////////////////////////////////////
//
//  !!!IMPORTANT!!!
//  Even though StorageServiceConfig is usually stored in textual format, it may
//  be overridden for some tablets and in this case it's stored in binary format
//  in the tablet's localdb. So binary backward-compatibility should be
//  maintained.
//
////////////////////////////////////////////////////////////////////////////////

message TStorageServiceConfig
{
    // Tablet channel profiles to use (legacy, see NBS-458).
    // optional uint32 ChannelsProfile = 1; // obsolete
    // optional uint32 ChannelsProfileSSD = 2; // obsolete
    // optional uint32 ChannelsProfileHybrid = 3; // obsolete

    // Schemeshard directory for volumes.
    optional string SchemeShardDir = 4;

    // Minimum blob size (in bytes) that lets compaction materialize zero blocks
    // and add this blob to the merged index.
    // optional uint32 WriteMergedBlobThreshold = 5; // obsolete

    // Minimum write request size (in bytes) that lets us write the data directly
    // to blobstorage (as a merged blob).
    optional uint32 WriteBlobThreshold = 6 [(NMarkers.AllowRuntimeUpdate) = true];

    // The size of data (in bytes) in the fresh blocks table that triggers flushing.
    optional uint32 FlushThreshold = 7 [(NMarkers.AllowRuntimeUpdate) = true];

    // Maximum number of fresh blocks to keep.
    // optional uint32 MaxFreshBlocks = 8; // obsolete

    // Number of overlapped blobs.
    // optional uint32 CompactionThreshold = 9; // obsolete

    // Number of blobs queued for cleanup.
    optional uint32 CleanupThreshold = 10 [(NMarkers.AllowRuntimeUpdate) = true];

    // Number of blobs queued for collect.
    optional uint32 CollectGarbageThreshold = 11 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout for hive locks (in milliseconds).
    optional uint32 HiveLockExpireTimeout = 12 [(NMarkers.AllowRuntimeUpdate) = true];

    // Cooldown time between tablet reboots (in milliseconds).
    optional uint32 TabletRebootCoolDownIncrement = 13 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 TabletRebootCoolDownMax = 14 [(NMarkers.AllowRuntimeUpdate) = true];

    // Should local service be started or not.
    optional bool DisableLocalService = 15;

    // Number of reties before pipe client reports failure.
    optional uint32 PipeClientRetryCount = 16 [(NMarkers.AllowRuntimeUpdate) = true];

    // Mimimum timeout before pipe client reconnect attempt.
    optional uint32 PipeClientMinRetryTime = 17 [(NMarkers.AllowRuntimeUpdate) = true];

    // Maximum timeout before pipe client reconnect attempt.
    optional uint32 PipeClientMaxRetryTime = 18 [(NMarkers.AllowRuntimeUpdate) = true];

    // Fresh data will be chunked into blobs of such size (in bytes) during flushing.
    optional uint32 FlushBlobSizeThreshold = 19 [(NMarkers.AllowRuntimeUpdate) = true];

    // Period to write usage stats to log (in milliseconds).
    // optional uint32 UsageStatsLogPeriod = 20;  // obsolete

    // Retry timeout for compaction started from monitoring (in milliseconds).
    optional uint32 CompactionRetryTimeout = 21 [(NMarkers.AllowRuntimeUpdate) = true];

    // Number of deletions before starting an update process.
    optional uint32 UpdateBlobsThreshold = 22 [(NMarkers.AllowRuntimeUpdate) = true];

    // File to write metering data.
    // optional string MeteringFilename = 23;  // obsolete

    // Number of garbage blocks before start compaction.
    optional uint32 CompactionGarbageThreshold = 24 [(NMarkers.AllowRuntimeUpdate) = true];

    // Maximum request size in bytes.
    optional uint64 MaxReadWriteRangeSize = 25 [(NMarkers.AllowRuntimeUpdate) = true];

    // Maximum blob range size (in bytes).
    optional uint32 MaxBlobRangeSize = 26 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout for considering client inactive after mounting (in milliseconds).
    optional uint32 InactiveClientsTimeout = 27 [(NMarkers.AllowRuntimeUpdate) = true];

    // Allow the service to unmount inactive clients.
    // optional bool UnmountInactiveClients = 28;  // obsolete

    // Allow multiple clients to mount the same volume (with access restrictions).
    // optional bool MultipleMountAllowed = 29;    // obsolete

    // Maximum allowed requests in-progress.
    optional uint32 MaxIORequestsInFlight = 30 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 MaxIORequestsInFlightSSD = 31 [(NMarkers.AllowRuntimeUpdate) = true];

    // Allow setting Version field in ModifyScheme request.
    optional bool AllowVersionInModifyScheme = 32 [(NMarkers.AllowRuntimeUpdate) = true];

    // Require mounting volume by any client willing to submit read/write/zero blocks requests.
    // optional bool MountRequired = 33;   // obsolete

    // Service version info.
    optional string ServiceVersionInfo = 34;

    // Size of allocation unit for SSD drives (in GiB).
    optional uint32 AllocationUnitSSD = 35 [(NMarkers.AllowRuntimeUpdate) = true];

    // Size of allocation unit for HDD drives (in GiB).
    optional uint32 AllocationUnitHDD = 36 [(NMarkers.AllowRuntimeUpdate) = true];

    // Throttling feature flags.
    optional bool ThrottlingEnabled = 37 [(NMarkers.AllowRuntimeUpdate) = true];
    optional bool ThrottlingEnabledSSD = 38 [(NMarkers.AllowRuntimeUpdate) = true];

    // Volumes stats upload to db period.
    optional uint32 StatsUploadInterval = 39 [(NMarkers.AllowRuntimeUpdate) = true];

    // Default throttling settings.
    optional uint32 ThrottlingBurstPercentage = 40 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint64 ThrottlingMaxPostponedWeight = 41 [(NMarkers.AllowRuntimeUpdate) = true];   // in bytes
    optional uint32 ThrottlingBoostTime = 42 [(NMarkers.AllowRuntimeUpdate) = true];            // in milliseconds
    optional uint32 ThrottlingBoostRefillTime = 43 [(NMarkers.AllowRuntimeUpdate) = true];      // in milliseconds

    // Disk boost rate corresponds to the following unit count.
    optional uint32 ThrottlingSSDBoostUnits = 44 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 ThrottlingHDDBoostUnits = 45 [(NMarkers.AllowRuntimeUpdate) = true];

    // Performance per allocation unit.
    optional uint32 SSDUnitReadBandwidth = 46 [(NMarkers.AllowRuntimeUpdate) = true];   // in MiB/s
    optional uint32 SSDUnitWriteBandwidth = 47 [(NMarkers.AllowRuntimeUpdate) = true];  // in MiB/s
    optional uint32 SSDMaxReadBandwidth = 48 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 SSDMaxWriteBandwidth = 49 [(NMarkers.AllowRuntimeUpdate) = true];   // in MiB/s
    optional uint32 SSDUnitReadIops = 50 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 SSDUnitWriteIops = 51 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 SSDMaxReadIops = 52 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 SSDMaxWriteIops = 53 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDUnitReadBandwidth = 54 [(NMarkers.AllowRuntimeUpdate) = true];   // in MiB/s
    optional uint32 HDDUnitWriteBandwidth = 55 [(NMarkers.AllowRuntimeUpdate) = true];  // in MiB/s
    optional uint32 HDDMaxReadBandwidth = 56 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 HDDMaxWriteBandwidth = 57 [(NMarkers.AllowRuntimeUpdate) = true];   // in MiB/s
    optional uint32 HDDUnitReadIops = 58 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDUnitWriteIops = 59 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDMaxReadIops = 60 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDMaxWriteIops = 61 [(NMarkers.AllowRuntimeUpdate) = true];

    optional NCloud.NProto.EAuthorizationMode AuthorizationMode = 62 [(NMarkers.AllowRuntimeUpdate) = true];

    // Throttler postpone/reject threshold in milliseconds.
    optional uint32 MaxThrottlerDelay = 63 [(NMarkers.AllowRuntimeUpdate) = true];

    // Partition backpressure feature calculation settings.
    optional uint32 CompactionScoreLimitForBackpressure = 64 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 CompactionScoreThresholdForBackpressure = 65 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 CompactionScoreFeatureMaxValue = 66 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 FreshByteCountLimitForBackpressure = 67 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 FreshByteCountThresholdForBackpressure = 68 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 FreshByteCountFeatureMaxValue = 69 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint64 CleanupQueueBytesLimitForBackpressure = 311 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint64 CleanupQueueBytesThresholdForBackpressure = 312 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 CleanupQueueBytesFeatureMaxValue = 313 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max write request cost multiplier due to backpressure.
    optional uint32 MaxWriteCostMultiplier = 70 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout to register client at volume.
    // InitialAddClientTimeout should include the time required to release
    // the volume lock and to bring the volume back up.
    optional uint32 InitialAddClientTimeout = 71 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout to register client after tablet local start.
    optional uint32 LocalStartAddClientTimeout = 72 [(NMarkers.AllowRuntimeUpdate) = true];

    // Channel configuration.
    optional string HDDSystemChannelPoolKind = 73;
    optional string HDDLogChannelPoolKind = 74;
    optional string HDDIndexChannelPoolKind = 75;
    optional string HDDMixedChannelPoolKind = 76;
    optional string HDDMergedChannelPoolKind = 77;
    optional string SSDSystemChannelPoolKind = 78;
    optional string SSDLogChannelPoolKind = 79;
    optional string SSDIndexChannelPoolKind = 80;
    optional string SSDMixedChannelPoolKind = 81;
    optional string SSDMergedChannelPoolKind = 82;
    optional string HybridSystemChannelPoolKind = 83;
    optional string HybridLogChannelPoolKind = 84;
    optional string HybridIndexChannelPoolKind = 85;
    optional string HybridMixedChannelPoolKind = 86;
    optional string HybridMergedChannelPoolKind = 87;

    // [obsolete] Channel allocation mode for schemeshard.
    // we always use explicit channel profiles.
    // optional EChannelAllocationMode ChannelAllocationMode = 88;

    // Scatters new volumes across multiple schemeshard directories
    // optional bool ScatterVolumesInSchemeShard = 89; // obsolete

    // FolderId of this NBS instance. Used for authorization.
    optional string FolderId = 90;

    // Enables allocation of special channels for Mixed blobs.
    optional bool AllocateSeparateMixedChannels = 91 [(NMarkers.AllowRuntimeUpdate) = true];

    // Retry timeout for cleanup started from monitoring (in milliseconds).
    optional uint32 CleanupRetryTimeout = 92 [(NMarkers.AllowRuntimeUpdate) = true];

    // Channel free space threshold - used for write request balancing.
    optional uint32 ChannelFreeSpaceThreshold = 93 [(NMarkers.AllowRuntimeUpdate) = true];
    // Channel min free space - used for write request balancing.
    optional uint32 ChannelMinFreeSpace = 94 [(NMarkers.AllowRuntimeUpdate) = true];

    // Minimum number of channels per partition.
    optional uint32 MinChannelCount = 95 [(NMarkers.AllowRuntimeUpdate) = true];

    // Weight of read/zero/describe requests in throttler's postponed request
    // queue, bytes.
    optional uint32 DefaultPostponedRequestWeight = 96 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout for client to send ping (in milliseconds).
    optional uint32 ClientRemountPeriod = 97 [(NMarkers.AllowRuntimeUpdate) = true];

    // Index caching parameters (only for partition2).
    optional uint32 ZoneBlockCount = 98 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HotZoneRequestCountFactor = 99 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 ColdZoneRequestCountFactor = 100 [(NMarkers.AllowRuntimeUpdate) = true];

    // Enables/disables write request batching.
    optional bool WriteRequestBatchingEnabled = 101 [(NMarkers.AllowRuntimeUpdate) = true];

    // BlockList cache size (only for partition2).
    optional uint32 BlockListCacheSizePercentage = 102 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max blobs to process in a single Cleanup op run.
    optional uint32 MaxBlobsToCleanup = 103 [(NMarkers.AllowRuntimeUpdate) = true];

    // Blob size limit in bytes.
    optional uint32 MaxBlobSize = 104 [(NMarkers.AllowRuntimeUpdate) = true];

    // Size of allocation unit for non-replicated SSD drives (in GiB).
    optional uint32 AllocationUnitNonReplicatedSSD = 105 [(NMarkers.AllowRuntimeUpdate) = true];

    // Performance per allocation unit for nonreplicated volumes.
    optional uint32 NonReplicatedSSDUnitReadBandwidth = 106 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 NonReplicatedSSDUnitWriteBandwidth = 107 [(NMarkers.AllowRuntimeUpdate) = true];   // in MiB/s
    optional uint32 NonReplicatedSSDMaxReadBandwidth = 108 [(NMarkers.AllowRuntimeUpdate) = true];     // in MiB/s
    optional uint32 NonReplicatedSSDMaxWriteBandwidth = 109 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 NonReplicatedSSDUnitReadIops = 110 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 NonReplicatedSSDUnitWriteIops = 111 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 NonReplicatedSSDMaxReadIops = 112 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 NonReplicatedSSDMaxWriteIops = 113 [(NMarkers.AllowRuntimeUpdate) = true];

    // Compaction type.
    optional ECompactionType SSDCompactionType = 114 [(NMarkers.AllowRuntimeUpdate) = true];
    optional ECompactionType HDDCompactionType = 115 [(NMarkers.AllowRuntimeUpdate) = true];

    // Enables approximate garbage compaction for partition v1.
    optional bool V1GarbageCompactionEnabled = 116 [(NMarkers.AllowRuntimeUpdate) = true];

    // Enables digest calculation & logging for some blocks.
    optional bool BlockDigestsEnabled = 117 [(NMarkers.AllowRuntimeUpdate) = true];

    // Partition2 index structures conversion attempt time interval (in ms).
    optional uint32 IndexStructuresConversionAttemptInterval = 118 [(NMarkers.AllowRuntimeUpdate) = true];

    // Calculate block digests for the following percentage of blocks in each
    // block group.
    optional uint32 DigestedBlocksPercentage = 119 [(NMarkers.AllowRuntimeUpdate) = true];

    // If there is more garbage in some range than this limit, compact it.
    // Measured in percents (similar to CompactionGarbageThreshold).
    optional uint32 CompactionRangeGarbageThreshold = 120 [(NMarkers.AllowRuntimeUpdate) = true];

    // Limits the number of affected blocks sent from compaction to addblobs.
    optional uint32 MaxAffectedBlocksPerCompaction = 121 [(NMarkers.AllowRuntimeUpdate) = true];

    // Real performance per allocation unit.
    optional uint32 RealSSDUnitReadBandwidth = 122 [(NMarkers.AllowRuntimeUpdate) = true];     // in MiB/s
    optional uint32 RealSSDUnitWriteBandwidth = 123 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 RealSSDUnitReadIops = 124 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 RealSSDUnitWriteIops = 125 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 RealHDDUnitReadBandwidth = 126 [(NMarkers.AllowRuntimeUpdate) = true];     // in MiB/s
    optional uint32 RealHDDUnitWriteBandwidth = 127 [(NMarkers.AllowRuntimeUpdate) = true];    // in MiB/s
    optional uint32 RealHDDUnitReadIops = 128 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 RealHDDUnitWriteIops = 129 [(NMarkers.AllowRuntimeUpdate) = true];

    // Period (in milliseconds) between recycling retired nonreplicated disks.
    optional uint32 NonReplicatedDiskRecyclingPeriod = 130 [(NMarkers.AllowRuntimeUpdate) = true];

    // Compaction delay settings.
    optional uint32 MaxCompactionDelay = 131 [(NMarkers.AllowRuntimeUpdate) = true];   // in ms
    optional uint32 MinCompactionDelay = 132 [(NMarkers.AllowRuntimeUpdate) = true];   // in ms
    optional uint32 CompactionScoreHistorySize = 133 [(NMarkers.AllowRuntimeUpdate) = true];

    // Volume preemption strategy.
    optional EVolumePreemptionType VolumePreemptionType = 134 [(NMarkers.AllowRuntimeUpdate) = true];

    // CPU load percentage to move volumes from host.
    optional uint32 PreemptionPushPercentage = 135 [(NMarkers.AllowRuntimeUpdate) = true];

    // CPU load percentage to move volumes to host.
    optional uint32 PreemptionPullPercentage = 136 [(NMarkers.AllowRuntimeUpdate) = true];

    // Partition tablet version to be used for new volumes.
    optional uint32 DefaultTabletVersion = 137 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max number of intervals stored in RangeMap for each blob (v2 only).
    optional uint32 MaxRangesPerBlob = 138 [(NMarkers.AllowRuntimeUpdate) = true];

    // Cleanup delay settings.
    optional uint32 MaxCleanupDelay = 139 [(NMarkers.AllowRuntimeUpdate) = true];  // in ms
    optional uint32 MinCleanupDelay = 140 [(NMarkers.AllowRuntimeUpdate) = true];  // in ms
    optional uint32 CleanupScoreHistorySize = 141 [(NMarkers.AllowRuntimeUpdate) = true];

    // Allow to change channel pool kinds upon volume resizing.
    optional bool PoolKindChangeAllowed = 142 [(NMarkers.AllowRuntimeUpdate) = true];

    // If set, service/volume will acquire devices for mounted volumes.
    optional bool AcquireNonReplicatedDevices = 143;

    // Inflight limit for IO requests.
    optional uint32 NonReplicatedInflightLimit = 144 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max disks per placement group.
    optional uint32 MaxDisksInPlacementGroup = 145 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max placement partitions per group.
    optional uint32 MaxPlacementPartitionCount = 295 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max disks per placement group with partition placement strategy.
    optional uint32 MaxDisksInPartitionPlacementGroup = 296 [(NMarkers.AllowRuntimeUpdate) = true];

    // Overrides WriteBlobThreshold for SSD volumes.
    optional uint32 WriteBlobThresholdSSD = 146 [(NMarkers.AllowRuntimeUpdate) = true];

    // DiskRegistry destroys broken disks after this period of time.
    optional uint32 BrokenDiskDestructionDelay = 147 [(NMarkers.AllowRuntimeUpdate) = true];   // in ms

    // Volume mount history duration.
    optional uint32 VolumeHistoryDuration = 148 [(NMarkers.AllowRuntimeUpdate) = true];    // in ms

    // Number of maximum blob count per range.
    optional uint32 SSDMaxBlobsPerRange = 149 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDMaxBlobsPerRange = 150 [(NMarkers.AllowRuntimeUpdate) = true];

    // Just drop fresh blocks upon Flush, don't save them as blobs (debug flag).
    optional bool FlushToDevNull = 151;

    // Max Compaction/Cleanup exec time per second.
    optional uint32 MaxCompactionExecTimePerSecond = 152 [(NMarkers.AllowRuntimeUpdate) = true];   // in ms
    optional uint32 MaxCleanupExecTimePerSecond = 153 [(NMarkers.AllowRuntimeUpdate) = true];  // in ms

    // Don't automatically enqueue garbage collection upon partition startup.
    optional bool DontEnqueueCollectGarbageUponPartitionStartup = 154 [(NMarkers.AllowRuntimeUpdate) = true];

    optional uint32 NonReplicatedDiskRepairTimeout = 155 [(NMarkers.AllowRuntimeUpdate) = true];

    // New volumes will be created with partition count proportional to their size.
    optional uint64 BytesPerPartition = 156 [(NMarkers.AllowRuntimeUpdate) = true];

    // Bytes per stripe (applicable for multipartition volumes).
    optional uint32 BytesPerStripe = 157 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max partitions per volume.
    optional uint32 MaxPartitionsPerVolume = 158 [(NMarkers.AllowRuntimeUpdate) = true];

    // Min timeout for agent to restore connection (in milliseconds).
    optional uint32 NonReplicatedAgentMinTimeout = 159 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout for DR -> DA requests (in milliseconds).
    optional uint32 AgentRequestTimeout = 160 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout before allowing infra to withdraw our agents/devices.
    optional uint32 NonReplicatedInfraTimeout = 161 [(NMarkers.AllowRuntimeUpdate) = true];

    // Timeout for nonrepl partition -> DA requests.
    // optional uint32 NonReplicatedRequestTimeout = 162; // obsolete

    // CompactionScore limit after which compaction throttling is disabled.
    optional uint32 CompactionScoreLimitForThrottling = 163 [(NMarkers.AllowRuntimeUpdate) = true];

    // CleanupQueueBytes limit after which cleanup throttling is disabled.
    optional uint64 CleanupQueueBytesLimitForThrottling = 164 [(NMarkers.AllowRuntimeUpdate) = true];

    // The desired byte count read/written by a compaction run.
    optional uint64 TargetCompactionBytesPerOp = 165 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max skipped blobs during range compaction for SSD disks.
    optional uint32 MaxSkippedBlobsDuringCompaction = 166 [(NMarkers.AllowRuntimeUpdate) = true];

    // MaxBlobsPerRange overrides for partition v2.
    optional uint32 SSDV2MaxBlobsPerRange = 167 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 HDDV2MaxBlobsPerRange = 168 [(NMarkers.AllowRuntimeUpdate) = true];

    // Enables incremental compaction for v1 tablets.
    optional bool IncrementalCompactionEnabled = 169 [(NMarkers.AllowRuntimeUpdate) = true];
    // Compaction in partition v1 will generate sparse merged blobs instead of
    // mixed blobs if this flag is set.
    // optional bool UseSparseMergedBlobs = 170; // obsolete

    // Enables some optimizations for small requests (affects partition v2 only).
    optional bool OptimizeForShortRanges = 171 [(NMarkers.AllowRuntimeUpdate) = true];

    // Consecutive timeout limit after which nr device is considered unavailable.
    // optional uint32 MaxConsecutiveDeviceTimeouts = 172; // obsolete

    // Max blobs and blocks processed by a single v2 garbage compaction iteration.
    optional uint32 CompactionGarbageBlobLimit = 173 [(NMarkers.AllowRuntimeUpdate) = true];
    optional uint32 CompactionGarbageBlockLimit = 174 [(NMarkers.AllowRuntimeUpdate) = true];

    // User data may be dumped on some monitoring pages if this flag is set.
    // See NBS-1726
    optional bool UserDataDebugDumpAllowed = 175 [(NMarkers.AllowRuntimeUpdate) = true];

    // Fresh channels configuration.
    optional string HDDFreshChannelPoolKind = 176;
    optional string SSDFreshChannelPoolKind = 177;
    optional string HybridFreshChannelPoolKind = 178;

    // Number of fresh channels per partition for SSD disks.
    optional uint32 FreshChannelCountSSD = 179 [(NMarkers.AllowRuntimeUpdate) = true];

    // Enables fresh channel write requests.
    optional bool FreshChannelWriteRequestsEnabled = 180 [(NMarkers.AllowRuntimeUpdate) = true];

    // Min timeout for nonrepl partition -> DA SSD requests.
    optional uint32 NonReplicatedMinRequestTimeoutSSD = 181 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max timeout for nonrepl partition -> DA SSD requests.
    optional uint32 NonReplicatedMaxRequestTimeoutSSD = 182 [(NMarkers.AllowRuntimeUpdate) = true];

    // Max timed out state duration after which nr device is considered unavailable.
    optional uint32 MaxTimedOutDeviceStateDuration = 183 [(NMarkers.AllowRuntimeUpdate) = true];

    // Run GC barriers for all channels in tablet history.
    // optional bool CleanupPartitionChannelsAtStartup = 184; // obsolete

