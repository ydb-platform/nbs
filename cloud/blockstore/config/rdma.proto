syntax = "proto3";

import "cloud/storage/core/protos/rdma.proto";
import "cloud/blockstore/public/api/protos/rdma.proto";

package NCloud.NBlockStore.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/config";

////////////////////////////////////////////////////////////////////////////////

message TRdmaTarget
{
    TRdmaEndpoint Endpoint = 1;
    NCloud.NProto.TRdmaServer Server = 2;   // deprecated
    optional uint32 WorkerThreads = 3;
}

message TRdmaConfig
{
    optional bool ClientEnabled = 1;
    NCloud.NProto.TRdmaClient Client = 2;

    optional bool ServerEnabled = 3;
    NCloud.NProto.TRdmaServer Server = 4;

    optional bool DiskAgentTargetEnabled = 5;
    TRdmaTarget DiskAgentTarget = 6;

    optional bool BlockstoreServerTargetEnabled = 7;
    TRdmaTarget BlockstoreServerTarget = 8;
}
