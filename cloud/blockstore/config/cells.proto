syntax = "proto2";

import "cloud/blockstore/config/client.proto";

package NCloud.NBlockStore.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/config";

////////////////////////////////////////////////////////////////////////////////

enum ECellDataTransport
{
    CELL_DATA_TRANSPORT_UNSET = 0;
    CELL_DATA_TRANSPORT_GRPC = 1;
    CELL_DATA_TRANSPORT_NBD = 2;
    CELL_DATA_TRANSPORT_RDMA = 3;
    CELL_DATA_TRANSPORT_ICV2 = 4;
};

////////////////////////////////////////////////////////////////////////////////

message TCellHostConfig
{
    optional string Fqdn = 1;

    // overrides Transport in TCellConfig.
    optional ECellDataTransport Transport = 2;
};

////////////////////////////////////////////////////////////////////////////////

message TCellConfig
{
    optional string CellId = 1;

    optional uint32 GrpcPort = 2;

    optional uint32 RdmaPort = 4;

    optional uint32 NbdPort = 5;

    optional uint32 SecureGrpcPort = 6;

    optional ECellDataTransport Transport = 7;

    repeated TCellHostConfig Hosts = 8;

    // Number of host in a cell to send DescribeVolume requests during volume
    // lookup.
    optional uint32 DescribeVolumeHostCount = 9;

    // Minimum number of hosts in a cell to have connections to, maintained
    // at all times rather than only at start. Configured hosts fill these
    // slots first; what they cannot fill is held by hosts discovered from
    // the tablet host of a mount, which is what keeps a way into a cell
    // whose configured hosts are all down.
    optional uint32 MinCellConnections = 10;

    // While the RDMA data endpoint is unavailable - either because it has not
    // been set up yet or because the connection broke - serve data over gRPC.
    optional bool GrpcDataFallbackEnabled = 11;

    // How long an RDMA connection that has dropped once has to stay up again
    // before data is moved back onto it, in milliseconds.
    optional uint32 RdmaSettleTime = 12;

    // Watch the hosts of this cell over gRPC and move a connection off a host
    // that stopped answering. Also moves it to the host where the volume
    // tablet lives, when a mount reports one.
    optional bool HostMigrationEnabled = 13;

    // How often every known host of the cell is pinged, in milliseconds.
    optional uint32 HostPingPeriod = 14;

    // How long a ping may take before the host counts as dead, in
    // milliseconds.
    optional uint32 HostPingTimeout = 15;

    // IC V2 port on the hosts listed above. Unset or zero means that the
    // peer has no configured IC V2 endpoint. Independent of data Transport.
    optional uint32 IcV2Port = 16;

    reserved 17;
}

////////////////////////////////////////////////////////////////////////////////

// IC V2 listener and outgoing data connections.
// Each peer selects its data transport independently.
message TCellsIcV2Config
{
    optional bool Enabled = 1 [default = false];

    // Numeric IPv4 or IPv6 address. IPv6 listener accepts only IPv6 sockets.
    optional string ListenAddress = 2 [default = "::"];
    // Must be set explicitly. Zero selects an ephemeral port.
    optional uint32 Port = 3;
    reserved 4;
    optional uint32 Threads = 5 [default = 1];
    // For outgoing channels, also includes TCP connection attempts.
    optional uint32 HandshakeTimeoutMs = 6 [default = 5000];
    optional bool ChecksumEvents = 7 [default = false];

    // Logical incoming connections, including completing callbacks. These
    // share the admission limit with pending hellos; with XDC this shared
    // limit is doubled. A completed auxiliary hello belongs to its main pair.
    optional uint32 MaxConnections = 8 [default = 128];
    // Per channel/data endpoint and for the data target; also bounds total
    // outstanding diagnostic Ping calls. Includes
    // queued results and running continuations.
    optional uint32 MaxPendingRequests = 9 [default = 1024];
    // Shared output queue limit for all IC V2 connections in this NBS;
    // also limits payload bytes held by diagnostic Ping calls.
    optional uint64 MaxOutputQueueBytes = 10 [default = 67108864];
    // Future continuations run here, separately from I/O and timer workers.
    optional uint32 CompletionThreads = 11 [default = 2];
    // Outgoing channels, including attempts and queued result continuations.
    // Also bounds live/retiring data bindings, including queued results.
    optional uint32 MaxOutgoingConnections = 12 [default = 128];
    // Serialized request and read/write payload limit.
    optional uint64 MaxDataRequestBytes = 13 [default = 4194304];
    // Per outgoing data endpoint and for the shared incoming data target.
    optional uint64 MaxDataInflightBytes = 14 [default = 67108864];
    // Incoming storage invocation, decoding and replies.
    optional uint32 DataWorkers = 15 [default = 1];

    // Negotiate a separate data socket when both peers enable XDC.
    // A peer with XDC disabled selects the ordinary single-socket channel.
    optional bool EnableXdc = 16 [default = false];

    reserved 17;
}

////////////////////////////////////////////////////////////////////////////////

message TCellsConfig
{
    // Mapping from CellId to fqdn hosts.
    repeated TCellConfig Cells = 1;

    // Cell id, blockstore server belongs to.
    optional string CellId = 2;

    // DescribeVolume timeout. If timeout is exceeded then we reply with error
    // indicating this and client may retry request.
    optional uint32 DescribeVolumeTimeout = 3;

    // Settings for Grpc client.
    optional TClientConfig GrpcClientConfig = 4;

    // Number of worker threads for RDMA Transport
    optional uint32 RdmaTransportWorkers = 5;

    // Enable/Disable feature
    optional bool CellsEnabled = 6;

    optional TCellsIcV2Config IcV2 = 7;
}
