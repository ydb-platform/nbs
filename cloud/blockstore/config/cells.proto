syntax = "proto2";

import "cloud/blockstore/config/client.proto";
import "cloud/blockstore/config/discovery.proto";

package NCloud.NBlockStore.NProto;

option go_package = "github.com/ydb-platform/nbs/cloud/blockstore/config";

////////////////////////////////////////////////////////////////////////////////

enum ECellDataTransport
{
    CELL_DATA_TRANSPORT_UNSET = 0;
    CELL_DATA_TRANSPORT_GRPC = 1;
    CELL_DATA_TRANSPORT_ICV2 = 2;
    CELL_DATA_TRANSPORT_RDMA = 3;
};

////////////////////////////////////////////////////////////////////////////////

message TCellHostConfig
{
    optional string Fqdn = 1;

    // overrides Transport in TCellConfig.
    optional ECellDataTransport Transport = 2;
};

////////////////////////////////////////////////////////////////////////////////

message TCellConfig
{
    optional string CellId = 1;

    optional uint32 GrpcPort = 2;

    optional uint32 RdmaPort = 4;

    optional uint32 NbdPort = 5;

    optional uint32 SecureGrpcPort = 6;

    optional ECellDataTransport Transport = 7;

    repeated TCellHostConfig Hosts = 8;

    // Number of host in a cell to send DescribeVolume requests during volume
    // lookup.
    optional uint32 DescribeVolumeHostCount = 9;

    // Minimum number of hosts in a cell to have connections to, maintained
    // at all times rather than only at start. Configured hosts fill these
    // slots first; what they cannot fill is held by hosts discovered from
    // the tablet host of a mount, which is what keeps a way into a cell
    // whose configured hosts are all down.
    optional uint32 MinCellConnections = 10;

    // While the RDMA or IC V2 data endpoint is unavailable - either because
    // it has not been set up yet or because the connection broke - serve data
    // over gRPC.
    optional bool GrpcDataFallbackEnabled = 11;

    // Use EndpointSettleTime. Honoured while EndpointSettleTime is unset.
    optional uint32 RdmaSettleTime = 12 [deprecated = true];

    // HostMigrationEnabled: the hosts are always watched over gRPC now, and a
    // connection always moves off a host that stopped answering and onto the
    // host where the volume tablet lives.
    reserved 13;

    // How often every known host of the cell is pinged, in milliseconds.
    optional uint32 HostPingPeriod = 14;

    // How long a ping may take before the host counts as dead, in
    // milliseconds.
    optional uint32 HostPingTimeout = 15;

    // Host masks resolved through EDS (TCellsConfig.Eds) into further hosts
    // of this cell, refreshed periodically. Hosts above stay regardless.
    repeated string EdsHostPatterns = 16;

    // How long an RDMA or IC V2 connection that has dropped once has to stay
    // up again before data is moved back onto it, in milliseconds.
    optional uint32 EndpointSettleTime = 17;
}

////////////////////////////////////////////////////////////////////////////////

message TCellsConfig
{
    // Mapping from CellId to fqdn hosts.
    repeated TCellConfig Cells = 1;

    // Cell id, blockstore server belongs to.
    optional string CellId = 2;

    // DescribeVolume timeout. If timeout is exceeded then we reply with error
    // indicating this and client may retry request.
    optional uint32 DescribeVolumeTimeout = 3;

    // Settings for Grpc client.
    optional TClientConfig GrpcClientConfig = 4;

    // Number of worker threads for RDMA Transport
    optional uint32 RdmaTransportWorkers = 5;

    // Enable/Disable feature
    optional bool CellsEnabled = 6;

    // EDS used to resolve EdsHostPatterns of the cells. HostPatterns,
    // InstancePort and SecureInstancePort are not used here: the patterns
    // come from each cell, the ports from its TCellConfig.
    optional TEdsConfig Eds = 7;
}
